[package]
name = "aivdm"
description = "no_std, no_alloc parser and encoder for AIS (ITU-R M.1371) messages over NMEA 0183"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aivdm"
readme = "../../README.md"
keywords = ["ais", "nmea", "no-std", "maritime", "aivdm"]
categories = ["parser-implementations", "no-std", "embedded", "encoding"]

[lints]
workspace = true

[features]
default = []
heapless = ["dep:heapless"]
defmt = ["dep:defmt"]
# Adds `to_uom()` conversions on the physical-quantity newtypes (Sog, Cog,
# Heading, Latitude, Longitude) to `uom` quantities. Optional and no_std
# compatible (uom's own "std" feature is not enabled) so it doesn't affect
# anyone who doesn't ask for it.
uom = ["dep:uom"]

[dependencies]
heapless = { version = "0.8", optional = true, default-features = false }
defmt = { version = "0.3", optional = true }
uom = { version = "0.38", optional = true, default-features = false, features = [
  "f64",
  "si",
  "autoconvert",
] }

[dev-dependencies]
proptest = "1"
criterion = { version = "0.7", features = ["html_reports"] }

[[bench]]
name = "codec"
harness = false
