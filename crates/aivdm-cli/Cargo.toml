[package]
name = "aivdm-cli"
description = "Command-line decoder for AIS (ITU-R M.1371) NMEA sentences, built on aivdm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/aivdm-cli"
readme = "../../README.md"
keywords = ["ais", "nmea", "maritime", "cli", "aivdm"]
categories = ["command-line-utilities", "parser-implementations"]

[[bin]]
name = "aivdm"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
aivdm = { path = "../aivdm", version = "0.1.0" }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
