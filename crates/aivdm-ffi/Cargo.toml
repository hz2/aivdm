[package]
name = "aivdm-ffi"
description = "C FFI bindings for the aivdm AIS decoder"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "aivdm_ffi"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
aivdm = { path = "../aivdm" }

# Metadata consumed by `cargo capi` (https://github.com/lu-zero/cargo-c) for
# consumers who want a polished, pkg-config-discoverable C library (headers
# installed as <prefix>/include/aivdm.h, library as libaivdm.{so,a}). Not
# required for local development: `cargo build -p aivdm-ffi` alone already
# produces a usable libaivdm_ffi.{a,so} plus the checked-in include/aivdm.h.
[package.metadata.capi.header]
name = "aivdm"
subdirectory = false
generation = false

[package.metadata.capi.library]
name = "aivdm"

[package.metadata.capi.pkg_config]
name = "aivdm"
filename = "aivdm"
