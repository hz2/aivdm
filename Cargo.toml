[workspace]
resolver = "2"
members = ["crates/aivdm", "crates/aivdm-cli", "crates/aivdm-ffi"]

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.87.0"
license = "MIT"
repository = "https://github.com/hz2/aivdm"
homepage = "https://github.com/hz2/aivdm"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
